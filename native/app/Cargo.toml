[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
core_types = { version = "0.1.0", path = "../core_types" }
native_shell = { version = "0.1.0", path = "../native_shell" }
physics_core = { version = "0.1.0", path = "../physics_core" }
pollster = "0.4.0"
renderer = { version = "0.1.0", path = "../renderer" }
scene_logic = { version = "0.1.0", path = "../scene_logic" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wgpu = "0.19.4"
winit = "0.30.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
