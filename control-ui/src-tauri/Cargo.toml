[package]
name = "screen-overlay-control"
version = "0.1.0"
description = "Companion control UI for ScreenOverlayPhysics"
authors = ["ScreenOverlayPhysics"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crossbeam-channel = "0.5"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
url = "2.5"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
screen-overlay-relay = { path = "../../relay" }
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
